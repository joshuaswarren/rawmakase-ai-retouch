[package]
name = "rawmakase-ai-retouch"
version = "0.2.0"
edition = "2024"
description = "Experimental AI Remove and AI Replace for RAWmakase's Remove tool, through a hosted model and your own API key"
license = "MIT"
repository = "https://github.com/pch/rawmakase-ai-retouch"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "rawmakase-ai-retouch"
path = "src/main.rs"

[dependencies]
# The SDK's API 3 (retouch generators, secret settings), pinned to the
# commit of pch/rawmakase#1093 that adds it, until it is in a release.
rawmakase-extension = { git = "https://github.com/pch/rawmakase", rev = "8335cb25647c5dbcb929272f875b2c77f3feda70" }
serde_json = "1"
# Data URIs for the images sent to the providers and read back from them.
base64 = "0.22"
# Encoding the region and the mask as PNG, and decoding what a provider
# returns: PNG, JPEG or WebP.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Blocking HTTPS with rustls and its bundled roots: no OpenSSL, no system TLS.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
strip = true
