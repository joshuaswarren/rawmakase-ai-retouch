[extension]
id = "dev.pch.ai-remove"
name = "AI Remove"
version = "0.1.0"
rawmakase = ">=0.5"
api = 3
authors = ["Piotr Chmolowski"]
license = "MIT"
repository = "https://github.com/pch/rawmakase-ai-remove"
description = "Experimental: removes what you paint with the Remove tool using a hosted AI model (fal.ai or Replicate) and your own API key. Each removal sends the region to the service and is one paid call."

[access]
network = true

[program]
path = "bin/rawmakase-ai-remove"
start = "on-demand"

[[setting]]
id = "provider"
name = "Service"
help = "Where the removal runs. Each removal is one paid call to it."
control = { segmented = ["fal.ai", "Replicate"] }
default = "fal.ai"

[[setting]]
id = "fal-key"
name = "fal.ai API key"
help = "From fal.ai > Dashboard > Keys. Used when Service is fal.ai."
control = "secret"
default = ""

[[setting]]
id = "replicate-token"
name = "Replicate API token"
help = "From replicate.com > Account > API tokens. Used when Service is Replicate."
control = "secret"
default = ""

[[setting]]
id = "replicate-model"
name = "Replicate model"
help = "owner/name or owner/name:version of a model that takes an image and a mask."
control = "text"
default = "bria/eraser"

[[retouch-generator]]
id = "remove"
name = "AI Remove"
uploads = true
