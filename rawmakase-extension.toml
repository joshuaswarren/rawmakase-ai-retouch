[extension]
id = "dev.pch.ai-remove"
name = "AI Retouch"
version = "0.2.0"
rawmakase = ">=0.5"
api = 3
authors = ["Piotr Chmolowski"]
license = "MIT"
repository = "https://github.com/pch/rawmakase-ai-retouch"
description = "Experimental: AI Remove and AI Replace in an AI Retouch tool, with a hosted AI model (fal.ai or Replicate) and your own API key. Paint over an area, optionally say what to do with it; each request sends the region to the service and is one paid call."

[access]
network = true

[program]
path = "bin/rawmakase-ai-retouch"
start = "on-demand"

[[setting]]
id = "provider"
name = "Service"
help = "Where the removal runs. Each removal is one paid call to it. No account yet? https://github.com/pch/rawmakase-ai-retouch/blob/main/docs/getting-a-key.md"
control = { segmented = ["fal.ai", "Replicate"] }
default = "fal.ai"

[[setting]]
id = "fal-key"
name = "fal.ai API key"
help = "From fal.ai > Dashboard > Keys, with the API preset. Used when Service is fal.ai. How to get one: https://github.com/pch/rawmakase-ai-retouch/blob/main/docs/getting-a-key.md#falai"
control = "secret"
default = ""

[[setting]]
id = "replicate-token"
name = "Replicate API token"
help = "From replicate.com > Account > API tokens. Used when Service is Replicate. How to get one: https://github.com/pch/rawmakase-ai-retouch/blob/main/docs/getting-a-key.md#replicate"
control = "secret"
default = ""

[[setting]]
id = "replace-model"
name = "Replace model"
help = "What AI Replace uses on fal.ai: Bria GenFill ($0.04 a megapixel) or FLUX.1 Fill [pro] ($0.05 a megapixel) fill the area with what you describe; Bria FIBO Edit ($0.04 an image) follows an instruction. On Replicate, AI Replace uses bria/fibo-edit."
control = { choice = ["Bria GenFill", "FLUX.1 Fill [pro]", "Bria FIBO Edit"] }
default = "Bria GenFill"

[[setting]]
id = "replicate-model"
name = "Replicate model"
help = "What AI Remove uses on Replicate without text: owner/name or owner/name:version of a model that takes an image and a mask. With text, it uses bria/fibo-edit."
control = "text"
default = "bria/eraser"

[[retouch-generator]]
id = "remove"
name = "AI Remove"
uploads = true
prompt = "optional"
prompt-hint = "Optional: e.g. remove the dogs, keep the people"

[[retouch-generator]]
id = "replace"
name = "AI Replace"
uploads = true
prompt = "required"
prompt-hint = "What to put there, e.g. a wooden bench"
